```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <link rel="stylesheet" href="form.CSS">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <div class="form-header">
            <div class="icon">🎓</div>

            <h1>Student Registration Form</h1>

            <p>
                Please fill in the details below to complete your registration.
            </p>
        </div>


        <form>

            <!-- Personal Information -->
            <section>

                <h2>Personal Information</h2>

                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input type="text"
                           id="name"
                           name="name"
                           placeholder="Enter your full name"
                           required>
                </div>


                <div class="row">

                    <div class="form-group">
                        <label for="class">Class</label>

                        <input type="text"
                               id="class"
                               name="class"
                               placeholder="Enter your class"
                               required>
                    </div>


                    <div class="form-group">
                        <label for="roll_no">Roll Number</label>

                        <input type="text"
                               id="roll_no"
                               name="roll_no"
                               placeholder="Enter roll number"
                               required>
                    </div>

                </div>


                <div class="row">

                    <div class="form-group">
                        <label for="dob">Date of Birth</label>

                        <input type="date"
                               id="dob"
                               name="dob"
                               required>
                    </div>


                    <div class="form-group">
                        <label for="city">City</label>

                        <select id="city" name="city" required>

                            <option value="">Select City</option>

                            <option value="Kanpur">Kanpur</option>
                            <option value="Lucknow">Lucknow</option>
                            <option value="Delhi">Delhi</option>
                            <option value="Noida">Noida</option>

                        </select>
                    </div>

                </div>


                <div class="form-group">

                    <label for="address">Address</label>

                    <textarea id="address"
                              name="address"
                              rows="3"
                              placeholder="Enter your complete address"
                              required></textarea>

                </div>

            </section>


            <!-- Contact Information -->
            <section>

                <h2>Contact Information</h2>

                <div class="row">

                    <div class="form-group">

                        <label for="email">Email Address</label>

                        <input type="email"
                               id="email"
                               name="email"
                               placeholder="example@gmail.com"
                               required>

                    </div>


                    <div class="form-group">

                        <label for="phone">Phone Number</label>

                        <input type="tel"
                               id="phone"
                               name="phone"
                               placeholder="Enter phone number"
                               required>

                    </div>

                </div>

            </section>


            <!-- Academic Information -->
            <section>

                <h2>Academic Information</h2>


                <div class="form-group">

                    <label>Subjects</label>

                    <div class="options">

                        <label>
                            <input type="checkbox"
                                   name="subject"
                                   value="Hindi">
                            Hindi
                        </label>


                        <label>
                            <input type="checkbox"
                                   name="subject"
                                   value="English">
                            English
                        </label>


                        <label>
                            <input type="checkbox"
                                   name="subject"
                                   value="Maths">
                            Maths
                        </label>


                        <label>
                            <input type="checkbox"
                                   name="subject"
                                   value="Physics">
                            Physics
                        </label>


                        <label>
                            <input type="checkbox"
                                   name="subject"
                                   value="Chemistry">
                            Chemistry
                        </label>

                    </div>

                </div>


                <div class="form-group">

                    <label>Gender</label>

                    <div class="options">

                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Male"
                                   required>
                            Male
                        </label>


                        <label>
                            <input type="radio"
                                   name="gender"
                                   value="Female">
                            Female
                        </label>

                    </div>

                </div>


                <div class="form-group">

                    <label for="file">Upload Document</label>

                    <input type="file"
                           id="file"
                           name="file">

                </div>

            </section>


            <!-- Buttons -->
            <div class="buttons">

                <button type="submit" class="register-btn">
                    Register
                </button>

                <button type="reset" class="reset-btn">
                    Reset
                </button>

            </div>

        </form>


        <!-- Footer -->
        <footer>

            <p>
                © 2026 Student Registration System
            </p>

        </footer>

    </div>

</body>
</html>
```
